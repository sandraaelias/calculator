<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input
        type="text"
        class="display"
        id="inputBox"
        disabled
        placeholder="0"
      />
      <div class="buttons">
        <button class="operatorBtn light-bg">AC</button>
        <button class="operatorBtn light-bg">DEL</button>
        <button class="operatorBtn light-bg">%</button>
        <button class="operatorBtn orange">/</button>
      </div>
      <div class="buttons">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operatorBtn orange">*</button>
      </div>
      <div class="buttons">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operatorBtn orange">+</button>
      </div>
      <div class="buttons">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operatorBtn orange">-</button>
      </div>
      <div class="buttons">
        <button>0</button>
        <button>00</button>
        <button>.</button>
        <button class="equalBtn">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
